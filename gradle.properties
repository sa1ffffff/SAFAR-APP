org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Reuse outputs between builds and build independent tasks at the same time.
org.gradle.caching=true
org.gradle.parallel=true
kotlin.daemon.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Safar Cloudflare Worker base URL (filled in after `wrangler deploy`)
safarApiUrl=https://safar-api.safar-api.workers.dev
