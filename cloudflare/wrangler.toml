name = "safar-api"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "safarbysaif"
FIREBASE_DATABASE_URL = "https://safarbysaif-default-rtdb.asia-southeast1.firebasedatabase.app"

# Daily ride cleanup at 03:30 Pakistan time (22:30 UTC).
[triggers]
crons = ["30 22 * * *"]

# Photo storage: R2 (bound below). KV works instead if R2 isn't enabled; bind only one.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "safar-photos"

# [[kv_namespaces]]
# binding = "PHOTOS_KV"
# id = "<filled in after: npx wrangler kv namespace create PHOTOS_KV>"

# Secret, set with: npx wrangler secret put FIREBASE_SERVICE_ACCOUNT  (paste the whole JSON key)

[observability]
enabled = true
